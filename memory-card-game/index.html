<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1>Memory Game</h1>

    <div class="stats">
      <p>Coups : <span id="moves">0</span></p>
      <p>Paires : <span id="pairs">0</span> / 6</p>
    </div>

    <button id="restart" type="button">Recommencer</button>

    <div class="cards-grid" id="grid"></div>

    <div id="win-message" class="hidden">
      <h2>Bravo !</h2>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
